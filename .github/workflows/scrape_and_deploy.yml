name: Scrape and Update Static Site

on:
  schedule:
    # Run every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:
      - name: Create issue on test failures
        if: env.TESTS_FAILED == '1'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = 'Automated tests failed in scheduled scraper workflow'
            const body = `The scheduled workflow failed unit tests. Please check the Actions run: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            // Try to find an existing open issue with the same title
            const { data: openIssues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 })
            const existingOpen = openIssues.find(i => i.title === title)
            if (existingOpen) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existingOpen.number, body: body + '\n\n(Automated notification - tests failed again)' })
            } else {
              // Check for a closed issue and reopen + comment instead of creating duplicates
              const { data: allIssues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 200 })
              const closed = allIssues.find(i => i.title === title)
              if (closed) {
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: closed.number, state: 'open' })
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: closed.number, body: body + '\n\n(Reopened by automation)' })
              } else {
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body })
              }
            }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run unit tests
        id: run_tests
        run: |
          # Run pytest; if tests fail, mark TESTS_FAILED in env for subsequent steps
          pytest -q || echo "TESTS_FAILED=1" >> $GITHUB_ENV

      - name: Create issue on test failures
        if: env.TESTS_FAILED == '1'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = 'Automated tests failed in scheduled scraper workflow'
            const body = `The scheduled workflow failed unit tests. Please check the Actions run: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body})

      - name: Get pre-scrape review count
        id: pre_count
        run: |
          before=$(python3 - <<'PY'
            const { data: openIssues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 })
            const existingOpen = openIssues.find(i => i.title === title)
            if (existingOpen) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existingOpen.number, body: body + '\n\n(Automated notification - workflow failed again)' })
            } else {
              const { data: allIssues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 200 })
              const closed = allIssues.find(i => i.title === title)
              if (closed) {
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: closed.number, state: 'open' })
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: closed.number, body: body + '\n\n(Reopened by automation)' })
              } else {
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body })
              }
            }
sys.path.insert(0,'src')
from models import get_session, Review
print(get_session().query(Review).count())
PY
          echo "before=$before" >> $GITHUB_OUTPUT

      - name: Run scrapers (batch update)
        env:
          DISPLAY_TIMEZONE: 'Europe/Helsinki'
        run: |
          python3 src/batch_update.py

      - name: Get post-scrape review count and compute delta
        id: post_count
        run: |
          after=$(python3 - <<'PY'
import sys
sys.path.insert(0,'src')
from models import get_session, Review
print(get_session().query(Review).count())
PY
          echo "after=$after" >> $GITHUB_OUTPUT
          added=$((after - ${{ steps.pre_count.outputs.before }}))
          echo "added=$added" >> $GITHUB_OUTPUT

      - name: Create issue if no new reviews were imported
        if: ${{ steps.post_count.outputs.added == '0' }}
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = 'Scrapers ran but imported 0 new reviews'
            const body = `The scheduled scrapers run completed but did not import any new reviews. Check the run logs: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body})

      - name: Generate static site
        run: |
          python3 scripts/generate_static.py

      - name: Commit & push changes
        if: ${{ success() }}
        env:
          GIT_COMMITTER_NAME: 'github-actions[bot]'
          GIT_COMMITTER_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
        run: |
          git config user.name "${GIT_COMMITTER_NAME}"
          git config user.email "${GIT_COMMITTER_EMAIL}"
          git add docs || true
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            ts=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            git commit -m "Automated site update: $ts [skip ci]"
            git push origin HEAD:main
          fi

      - name: Create issue on job failure
        if: ${{ failure() }}
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = 'Scheduled scraper workflow failed'
            const body = `The scheduled scraper workflow failed. Inspect the run here: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body})
