name: Scrape and Update Static Site

on:
  schedule:
    # Run every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: scrape-and-update
  cancel-in-progress: true

jobs:
  scrape_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run scrapers (batch update)
        env:
          DISPLAY_TIMEZONE: 'Europe/Helsinki'
        run: |
          # Run the batch importer which discovers and scrapes reviews
          python3 src/batch_update.py

      - name: Generate static site
        run: |
          python3 scripts/generate_static.py

      - name: Commit & push changes
        env:
          GIT_COMMITTER_NAME: 'github-actions[bot]'
          GIT_COMMITTER_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
        run: |
          git config user.name "${GIT_COMMITTER_NAME}"
          git config user.email "${GIT_COMMITTER_EMAIL}"
          git add docs || true
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            ts=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            git commit -m "Automated site update: $ts [skip ci]"
            git push origin HEAD:main
          fi
